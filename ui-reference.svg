<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1190" viewBox="0 0 1280 1190" role="img" aria-labelledby="title desc">
<title id="title">PID control Cart-Pole 介面配置參考</title><desc id="desc">上方小車與末端重心動畫，右側參數，下方狀態回饋、兩張同步波形與 PID 圖文教學。此圖為版面示意，數值與曲線非測試證據。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#202633;font-size:18px}.title{font-size:30px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:15px;fill:#536174}.panel{fill:#fff;stroke:#d6dce6}.button{fill:#edf1f7;stroke:#c8d1de}.axis{fill:none;stroke:#bec8d6}.p{stroke:#2563eb;fill:none}.i{stroke:#b45309;fill:none}.d{stroke:#7c3aed;fill:none}</style>
<rect width="1280" height="1190" fill="#f7f8fa"/><text x="40" y="55" class="title">PID control Cart-Pole</text><text x="40" y="85" class="small">倒單擺 PID 平衡實驗室 · 末端集中質量 · UI 參考示意，非測試截圖</text>
<rect class="panel" x="40" y="110" width="800" height="420" rx="12"/><rect class="panel" x="860" y="110" width="380" height="420" rx="12"/>
<text x="62" y="145" class="head">PID 控制 · 調整中</text><line x1="80" y1="338" x2="798" y2="338" class="axis"/><line x1="422" y1="176" x2="422" y2="376" class="axis" stroke-dasharray="5 5"/><rect x="395" y="322" width="54" height="26" fill="#202633"/><line x1="422" y1="326" x2="435" y2="203" stroke="#bc915b" stroke-width="9"/><circle cx="435" cy="203" r="12" fill="#2563eb"/><text x="460" y="210">末端重心</text><text x="80" y="368" class="small">−8 m</text><text x="745" y="368" class="small">+8 m</text><text x="62" y="404">重心偏移：+0.012 m</text><text x="360" y="404">車速：+0.24 m/s</text>
<rect x="62" y="428" width="146" height="42" rx="6" fill="#202633"/><text x="90" y="455" style="fill:#fff">一鍵平衡</text><rect class="button" x="220" y="428" width="105" height="42" rx="6"/><text x="254" y="455">重置</text><rect class="button" x="337" y="428" width="146" height="42" rx="6"/><text x="365" y="455">重新開始</text><rect class="button" x="567" y="428" width="105" height="42" rx="6"/><text x="589" y="455">← 向左</text><rect class="button" x="684" y="428" width="105" height="42" rx="6"/><text x="705" y="455">向右 →</text><text x="62" y="507" class="small">越界時保留參數，自動回到本輪初始狀態重跑；清空上一輪波形。</text>
<text x="883" y="145" class="head">平衡控制參數</text><text x="885" y="185">Kp（1/s）</text><rect class="button" x="1075" y="158" width="140" height="37" rx="5"/><text x="1090" y="184">6.0</text><text x="885" y="233">Ki（1/s²）</text><rect class="button" x="1075" y="206" width="140" height="37" rx="5"/><text x="1090" y="232">12.0</text><text x="885" y="281">Kd（無因次）</text><rect class="button" x="1075" y="254" width="140" height="37" rx="5"/><text x="1090" y="280">1.0</text><text x="885" y="329">手動速度（m/s）</text><rect class="button" x="1075" y="302" width="140" height="37" rx="5"/><text x="1090" y="328">3.0</text><text x="885" y="375">實驗初始姿態</text><rect class="button" x="885" y="389" width="330" height="40" rx="5"/><text x="900" y="416">直立偏 6°　▾</text><text x="885" y="461" class="small">重置：全部數值歸零、下垂、停止</text><text x="885" y="487" class="small">重新開始：保留參數、從初始姿態重跑</text><text x="885" y="511" class="small">一鍵平衡：套用 6／12／1 並執行</text>
<rect class="panel" x="40" y="550" width="1200" height="100" rx="10"/><text x="62" y="585" class="head">已達直立平衡</text><text x="62" y="615">目前觀察窗內已穩定，不提供調參建議。</text><text x="62" y="637" class="small">須連續 2 秒：重心在上方、水平偏移 &lt; 2 cm、角速度 &lt; 0.05 rad/s；不要求小車停在中央。</text>
<rect class="panel" x="40" y="670" width="590" height="230" rx="10"/><rect class="panel" x="650" y="670" width="590" height="230" rx="10"/><text x="62" y="706" class="head">重心水平偏移（m）</text><text x="672" y="706" class="head">PID 修正速度分量（m/s）</text><path d="M98 729V856H599 M708 729V856H1209" class="axis"/><path d="M98 792H599 M708 792H1209" class="axis" stroke-dasharray="4 4"/><text x="70" y="798" class="small">0</text><text x="680" y="798" class="small">0</text>
<path d="M98 750C120 750 125 845 153 820S185 760 222 784S260 810 295 793S340 784 390 792S490 793 599 792" class="p" stroke-width="2.5"/><path d="M708 748C735 748 740 832 770 812S810 770 850 790S915 799 969 793S1110 792 1209 792" class="p" stroke-width="2"/><path d="M708 812C785 818 816 779 860 781S1040 784 1209 784" class="i" stroke-width="2"/><path d="M708 825C730 835 748 738 770 770S808 820 850 795S910 790 969 792S1110 792 1209 792" class="d" stroke-width="2"/><text x="98" y="881" class="small">0</text><text x="550" y="881" class="small">12 秒</text><text x="708" y="881" class="small">0</text><text x="1158" y="881" class="small">12 秒</text><text x="1010" y="706" style="fill:#2563eb">P</text><text x="1060" y="706" style="fill:#b45309">I</text><text x="1110" y="706" style="fill:#7c3aed">D</text>
<rect class="panel" x="40" y="920" width="1200" height="230" rx="10"/><text x="62" y="957" class="head">看懂 PID：小車如何接住重心？　▾</text><text x="62" y="993">量測重心 → 計算 P＋I＋D → 修正小車速度 → 擺桿反應 → 再次量測</text><text x="62" y="1034">P · 目前偏移</text><text x="455" y="1034">I · 累積偏移</text><text x="851" y="1034">D · 偏移變化率</text><text x="62" y="1067">P = Kp × e</text><text x="455" y="1067">I = Ki × ∫e dt</text><text x="851" y="1067">D = Kd × de/dt</text><text x="62" y="1105" class="small">實作時加入追趕重心圖解</text><text x="455" y="1105" class="small">實作時加入曲線面積圖解</text><text x="851" y="1105" class="small">實作時加入曲線斜率圖解</text><text x="62" y="1132" class="small">教學必須說明：起擺不是 PID；下垂不等於平衡；實際車速受限制；此處採速度輸出模型。</text>
</svg>
